<h3>RawDIC * pro nestandartní formát disku</h3>
RawDIC je preferovaná utilita pro instalace WHDLoad, vytváří disk image z
originálních disků se speciálním diskovým formátem. Více informací v dokumentaci
RawDIC, nachází se v <tt>developerském</tt> archívu WHDLoad.
